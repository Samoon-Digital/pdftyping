name: pdftyping
description: "A new Flutter project."
publish_to: "none"
version: 1.7.0+7

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_mobile_ads: ^5.1.0
  shared_preferences: ^2.3.4
  firebase_core: any
  firebase_analytics: any
  firebase_messaging: any
  flutter_local_notifications: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-VariableFont.ttf

# Launcher icon configuration (uses the provided 512x512 PNG)
flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/play_store_512.png
