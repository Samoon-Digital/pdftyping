name: pdftyping
description: "A new Flutter project."
publish_to: "none"
version: 1.8.1+9

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_mobile_ads: ^5.1.0
  in_app_update: ^4.2.3
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_in_app_messaging: ^0.9.2+6
  flutter_local_notifications: ^22.0.1
  in_app_review: ^2.0.12
  share_plus: ^13.2.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/
    - assets/launcher.png

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-VariableFont.ttf

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/launcher.png
