name: pdftyping
description: "A new Flutter project."
publish_to: 'none'
version: 1.5.0+5

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  pdf: ^3.11.2
  printing: ^5.13.4
  path_provider: ^2.1.5
  google_mobile_ads: ^5.1.0
  syncfusion_flutter_pdfviewer: ^28.1.33
  shared_preferences: ^2.3.4
  url_launcher: ^6.3.1
  firebase_core: any
  firebase_analytics: any
  firebase_messaging: any
  flutter_local_notifications: any
  in_app_purchase: any
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fonts/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-VariableFont.ttf

# Launcher icon configuration (uses the provided 512x512 PNG)
flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/play_store_512.png
