      animation: sk 1.4s ease infinite;
    }

      0% {
        background-position: 100% 0
      }

        background-position: -100% 0
      }
    }

  <!-- Skeleton shown instantly while Flutter WASM loads -->

  <script>
    (function () {
      var hidden = false;

      function hideSkeleton() {
        if (hidden) return;
        hidden = true;
        var el = document.getElementById('sk');
        if (!el) return;
        el.style.transition = 'opacity 0.2s ease';
        el.style.opacity = '0';
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 220);
      }

      function hideAfterFirstPaint() {
        requestAnimationFrame(function () {
          requestAnimationFrame(hideSkeleton);
        });
      }

      function flutterMounted() {
        if (
          document.querySelector(
            'flt-glass-pane, flutter-view, flt-scene-host, flt-semantics-placeholder, [flt-clip], canvas'
          )
        ) {
          return true;
        }
        var children = document.body ? document.body.children : [];
        for (var i = 0; i < children.length; i++) {
          var node = children[i];
          if (node.id === 'sk' || node.tagName === 'SCRIPT') continue;
          return true;
        }
        return false;
      }

      function pollUntilMounted() {
        if (hidden) return;
        if (flutterMounted()) {
          hideAfterFirstPaint();
          return;
        }
        requestAnimationFrame(pollUntilMounted);
      }

      // Primary: remove shimmer as soon as Flutter DOM mounts.
      if (flutterMounted()) {
        hideAfterFirstPaint();
      } else {
        var observer = new MutationObserver(function () {
          if (!flutterMounted()) return;
          observer.disconnect();
          hideAfterFirstPaint();
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        // Secondary: first-frame signal from bootstrap.
        window.addEventListener('flutter-first-frame', function () {
          observer.disconnect();
          hideAfterFirstPaint();
        }, { once: true });

        // Tertiary: frame polling backup (dynamic, no fixed timeout)
        requestAnimationFrame(pollUntilMounted);
      }
    })();
  </script>
