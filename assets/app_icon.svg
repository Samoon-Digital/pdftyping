<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
  </defs>

  <!-- Safe-zone: All content inside 80px margin = 352px center area -->
  <!-- Works perfectly in both circle (Android) and rounded-rect (iOS) masks -->

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />

  <!-- White Document Paper (centered, well inside safe zone) -->
  <rect x="148" y="108" width="216" height="280" rx="16" fill="#FFFFFF" />

  <!-- Folded corner effect -->
  <path d="M322 108 L364 150 L322 150 Z" fill="#E3F2FD" />
  <path d="M322 108 L364 150" stroke="#BBDEFB" stroke-width="2" fill="none" />

  <!-- Text lines on document -->
  <rect x="184" y="168" width="144" height="10" rx="5" fill="#90CAF9" />
  <rect x="184" y="196" width="144" height="10" rx="5" fill="#90CAF9" />
  <rect x="184" y="224" width="108" height="10" rx="5" fill="#90CAF9" />
  <rect x="184" y="252" width="128" height="10" rx="5" fill="#90CAF9" />
  <rect x="184" y="280" width="80" height="10" rx="5" fill="#90CAF9" />

  <!-- Red PDF label badge (centered below document) -->
  <rect x="196" y="336" width="120" height="48" rx="12" fill="#EF4444" />
  <text x="256" y="368" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" letter-spacing="3" fill="#FFFFFF" text-anchor="middle">PDF</text>
</svg>